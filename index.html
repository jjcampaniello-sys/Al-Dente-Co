<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BastaWatts - Cuisson Passive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🌱 BastaWatts</h1>
    
    <div class="row">
        <div class="group half">
            <label for="category">Catégorie :</label>
            <select id="category" onchange="toggleInputs()">
                <option value="pates">🍝 Pâtes</option>
                <option value="riz">🌾 Riz</option>
                <option value="cereales">🥣 Céréales</option>
            </select>
        </div>
        <div class="group half">
            <label for="poids">Masse (g) :</label>
            <input type="number" id="poids" value="200" min="10" oninput="calculer()">
        </div>
    </div>

    <!-- Options dynamiques Pâtes -->
    <div id="pates-options" class="row">
        <div class="group half">
            <label for="formePates">Type de pâtes :</label>
            <select id="formePates" onchange="calculer()">
                <option value="fines">Fines</option>
                <option value="epaisses" selected>Épaisses</option>
                <option value="completes">Complètes</option>
            </select>
        </div>
        <div class="group half">
            <label for="tempsPaquet">T. Paquet (min) :</label>
            <input type="number" id="tempsPaquet" value="9" min="1" oninput="calculer()">
        </div>
    </div>

    <!-- Options dynamiques Riz/Céréales -->
    <div id="grains-options" class="group" style="display:none;">
        <label for="typeGrain">Type de grain :</label>
        <select id="typeGrain" onchange="calculer()">
            <option value="riz_blanc">Riz Blanc / Basmati</option>
            <option value="riz_complet">Riz Complet</option>
            <option value="quinoa">Quinoa</option>
            <option value="boulgour">Boulgour</option>
            <option value="ble_grain">Grains de Blé (Ebly)</option>
        </select>
    </div>

    <div class="row">
        <div class="group half">
            <label for="casserole">Casserole :</label>
            <select id="casserole" onchange="calculer()">
                <option value="lourde">Fonte/Inox Épais</option>
                <option value="legere">Alu/Inox Fin</option>
            </select>
        </div>
        <div class="group half">
            <label for="altitude">Altitude :</label>
            <select id="altitude" onchange="calculer()">
                <option value="0">Plaine (0-500m)</option>
                <option value="1000">Montagne (500-1500m)</option>
                <option value="2000">Haute M. (>1500m)</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="group full">
            <label for="tarifKwh">Tarif Élec (€/kWh) :</label>
            <input type="number" id="tarifKwh" value="0.25" min="0" step="0.01" oninput="calculer()">
        </div>
    </div>

    <div class="box">
        <div class="eco-metrics">
            <strong>💧 Eau :</strong> <span id="eau">3.00</span>L | 
            <strong>🧂 Sel :</strong> <span id="sel">30</span>g
        </div>
        <ol class="step-list" id="prepSteps"></ol>
        <div class="eco-badge">
            📉 Éco : ~<span id="ecoWh">0</span>Wh soit <span id="ecoEur">0.00</span>€
        </div>
    </div>

    <div class="timer" id="disp">00:00</div>
    <button id="btn" onclick="toggle()">Lancer la cuisson passive</button>
</div>

<script src="app.js"></script>
</body>
</html>
